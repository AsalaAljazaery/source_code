
<html>
  <head>
    <title>ECG Prediction</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #333;
      }

      .form-container {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        
      }

      .form-container h2 {
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
        color: #333;
      }

      .form-container label {
        display: block;
        margin-bottom: 10px;
        color: #555;
      }

      .form-container input[type="text"],
      .form-container input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }

      .form-container input[type="submit"] {
        background-color: #4caf50;
        color: #fff;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
      }

      .form-container input[type="submit"]:hover {
        background-color: #45a049;
      }

      .form-group {
      margin-bottom: 10px;
      display: inline-block;
    }

    .image-container {
      text-align: center;
      margin-bottom: 10px;
    }
    .image-container img {
      max-width: 40%;
      height: auto;
    }
    </style>

</head>
<body>
  <div class="image-container">
    <img src="{{url_for('static', filename='Image.png')}}" >
  </div>

  <div class="container">
    <h2> ECG Classification</h2>
    <div class="form-container">

        <form action="{{url_for('predict')}}" method="post" enctype="multipart/form-data" id="prediction-form">

          <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" name="age" placeholder="Enter your age" required="required"/>
          </div>

          <div class="form-group">

          <label for="height">Height:</label>
          <input type="number" name="height" placeholder="Height" required="required"/>
          </div>

          <div class="form-group">

          <label for="weight">Weight:</label>
          <input type="number" name="weight" placeholder="Weight" required="required"/>
          </div>
          
          <div class="form-group">

            <label for="sex">Sex:</label>
            <input type="text" name="sex" placeholder="Enter 'F' OR 'M'" required pattern="[FfMm]" required="required" />
            </div>


          <div class="form-group">

          <label for="ecg-image">Upload ECG Image:</label>
          <input type="file" id="ecg-image" name="img" required />
         </div>

          <input type="submit" value="Predict" />

        </form>
      </div>
    </div>



</body>
</html>
