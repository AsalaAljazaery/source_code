<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coronary Heart Disease Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: row; /* Horizontal layout using flexbox */
      align-items: center; /* Vertically center the label and input */
    }
    label {
      font-weight: bold;
      display: inline-block;
      width: 30%; /* Adjust the label width as needed */
      font-size: 14px;
    }
    input[type="text"],
    select {
      width: 70%; /* Adjust the input width as needed */
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    select {
      width: 70%;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .image-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .image-container img {
      max-width: 100%;
      height: auto;
    }
    h2 {
      background-color: #007BFF;
      color: #fff;
      padding: 10px;
      border-radius: 10px 10px 0 0;
      margin: 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="image-container">
    <img src="{{url_for('static', filename='Heart.avif')}}">
</div>

<div class="container">
    <h2>Coronary Heart Disease Prediction</h2>
    <br>
    <form action="{{ url_for('predict') }}" method="post">
        <div class="form-group">
            <label for="sex">Sex:</label>
            <select name="sex" id="sex" required>
                <option value="0">Female</option>
                <option value="1">Male</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">Age:</label>
            <input type="text" name="age" placeholder="Age" required="required" />
        </div>

        <div class="form-group">
            <label for="CurrentSmoker">Current Smoker:</label>
            <select name="CurrentSmoker" id="CurrentSmoker" required>
              <option value="0">No</option>
              <option value="1">Yes</option>
          </select>
        </div>

        <div class="form-group">
            <label for="CigsPerDay">Cigarettes Per Day:</label>
            <input type="text" name="CigsPerDay" placeholder="Cigarettes Per Day" required="required"/>
        </div>

        <div class="form-group">
            <label for="PrevalentHyp">Hypertensive:</label>
            <select name="PrevalentHyp" id="PrevalentHyp" required>
              <option value="1">No</option>
              <option value="0">Yes</option>
          </select>
                </div>

        <div class="form-group">
            <label for="TotChol">Total Cholesterol Level:</label>
            <input type="text" name="TotChol" placeholder="Total Cholesterol" required="required"/>
        </div>

        <div class="form-group">
            <label for="SysBP">Systolic Blood Pressure:</label>
            <input type="text" name="SysBP" placeholder="Systolic Blood Pressure" required="required"/>
        </div>

        <div class="form-group">
            <label for="DiaBP">Diastolic Blood Pressure:</label>
            <input type="text" name="DiaBP" placeholder="Diastolic Blood Pressure" required="required"/>
        </div>

        <div class="form-group">
            <label for="BMI">Body Mass Index (BMI):</label>
            <input type="text" name="BMI" placeholder="BMI" required="required"/>
        </div>

        <div class="form-group">
            <label for="HeartRate">Heart Rate:</label>
            <input type="text" name="HeartRate" placeholder="Heart Rate" required="required"/>
        </div>

        <div class="form-group">
            <label for="Glucose">Glucose level:</label>
            <input type="text" name="Glucose" placeholder="Glucose" required="required"/>
        </div>

        <button type="submit">Start</button>
    </form>
    <br>
    <br>
    <b>{{ prediction_text }}</b>
</div>

</body>
</html>
